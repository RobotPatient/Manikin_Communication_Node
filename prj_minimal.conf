# Minimal configuration for debugging build issues

# Basic peripherals
CONFIG_GPIO=y

# Core features
CONFIG_CLOCK_CONTROL=y

# Enable Zephyr CRC library
CONFIG_CRC=y

# Disable Bluetooth to simplify build
CONFIG_BT=n

# Memory management
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Logging configuration - more verbose for better diagnostics
CONFIG_LOG=y
# Set to WARNING level for more detailed messages
CONFIG_LOG_MAX_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y 
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# Stack sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096

# Console configuration - UART console disabled to avoid DTS issues
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n

# Watchdog for reliability
CONFIG_WATCHDOG=y

# CPR Manikin custom configuration
CONFIG_CPR_MANIKIN_BLE_NOTIFICATION_QUEUE_SIZE=64
CONFIG_CPR_MANIKIN_MAX_NOTIFICATION_RETRY=5
CONFIG_CPR_MANIKIN_PRIORITY_HIGH_THRESHOLD=80
CONFIG_CPR_MANIKIN_PRIORITY_MEDIUM_THRESHOLD=50