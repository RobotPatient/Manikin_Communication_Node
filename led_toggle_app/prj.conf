# Generic Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="LED Toggle"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=1
CONFIG_BT_LE_ADVERTISING=y

# GATT Services
CONFIG_BT_GATT_DYNAMIC_DB=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# GPIO for LED
CONFIG_GPIO=y

# Enable DTB aliases
CONFIG_DEVICE_DT_ALIAS=y